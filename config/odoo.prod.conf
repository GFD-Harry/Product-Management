[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
db_name = product_management_prod
log_level = info
http_interface = 0.0.0.0
proxy_mode = True
list_db = False

; Server sizing
workers = 3
max_cron_threads = 1

limit_memory_soft = 536870912
limit_memory_hard = 805306368

limit_request = 4096

limit_time_cpu = 60
limit_time_real = 120
